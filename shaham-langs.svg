<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 282" width="420" height="282" role="img" aria-label="Top languages">
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shineX{0%{transform:translateX(-140px)}60%,100%{transform:translateX(460px)}}
.row{opacity:0;animation:fadeUp .5s ease forwards}
.sh{animation:shineX 4s ease-in-out 2.2s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#ff7eb6;#c084fc;#ff7eb6" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#c084fc;#ff7eb6;#c084fc" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cardc"><rect x="1" y="1" width="418" height="280" rx="14"/></clipPath>
</defs>
<rect x="1" y="1" width="418" height="280" rx="14" fill="#170e28" stroke="url(#tg)" stroke-width="1.5"/>
<text x="20" y="34" font-size="16" font-weight="bold" fill="url(#tg)">📊 Top Languages &amp; Frameworks</text>

<!-- Progress Bar Header -->
<g transform="translate(20, 58)">
  <rect x="0" y="0" width="380" height="11" rx="5.5" fill="#241740"/>
  <g clip-path="url(#cardc)">
    <rect x="0" y="0" width="171.0" height="11" fill="#96bf48"/>
    <rect x="171.0" y="0" width="114.0" height="11" fill="#fde047"/>
    <rect x="285.0" y="0" width="57.0" height="11" fill="#ff7a59"/>
    <rect x="342.0" y="0" width="38.0" height="11" fill="#c084fc"/>
  </g>
</g>

<g class="row" style="animation-delay:0.40s">
  <circle cx="26" cy="91" r="5" fill="#96bf48"/>
  <text x="40" y="96" font-size="13.5" fill="#e6edf3" font-weight="bold">Liquid (Shopify)</text>
  <text x="396" y="96" text-anchor="end" font-size="13.5" fill="#96bf48" font-weight="bold">45.0%</text>
  <rect x="40" y="104" width="356" height="9" rx="4.5" fill="#241740"/>
  <rect class="bar" x="40" y="104" width="160" height="9" rx="4.5" fill="#96bf48">
    <animate attributeName="width" from="0" to="160" dur="1.1s" begin="0.5s" fill="freeze"/>
  </rect>
</g>

<g class="row" style="animation-delay:0.65s">
  <circle cx="26" cy="133" r="5" fill="#fde047"/>
  <text x="40" y="138" font-size="13.5" fill="#e6edf3" font-weight="bold">JavaScript</text>
  <text x="396" y="138" text-anchor="end" font-size="13.5" fill="#fde047" font-weight="bold">30.0%</text>
  <rect x="40" y="146" width="356" height="9" rx="4.5" fill="#241740"/>
  <rect class="bar" x="40" y="146" width="107" height="9" rx="4.5" fill="#fde047">
    <animate attributeName="width" from="0" to="107" dur="1.1s" begin="0.75s" fill="freeze"/>
  </rect>
</g>

<g class="row" style="animation-delay:0.90s">
  <circle cx="26" cy="175" r="5" fill="#ff7a59"/>
  <text x="40" y="180" font-size="13.5" fill="#e6edf3" font-weight="bold">HTML</text>
  <text x="396" y="180" text-anchor="end" font-size="13.5" fill="#ff7a59" font-weight="bold">15.0%</text>
  <rect x="40" y="188" width="356" height="9" rx="4.5" fill="#241740"/>
  <rect class="bar" x="40" y="188" width="53" height="9" rx="4.5" fill="#ff7a59">
    <animate attributeName="width" from="0" to="53" dur="1.1s" begin="1.0s" fill="freeze"/>
  </rect>
</g>

<g class="row" style="animation-delay:1.15s">
  <circle cx="26" cy="217" r="5" fill="#c084fc"/>
  <text x="40" y="222" font-size="13.5" fill="#e6edf3" font-weight="bold">CSS / Tailwind</text>
  <text x="396" y="222" text-anchor="end" font-size="13.5" fill="#c084fc" font-weight="bold">10.0%</text>
  <rect x="40" y="230" width="356" height="9" rx="4.5" fill="#241740"/>
  <rect class="bar" x="40" y="230" width="35" height="9" rx="4.5" fill="#c084fc">
    <animate attributeName="width" from="0" to="35" dur="1.1s" begin="1.25s" fill="freeze"/>
  </rect>
</g>

<g clip-path="url(#cardc)"><rect class="sh" x="0" y="0" width="100" height="282" fill="url(#shg)" transform="skewX(-15)"/></g>
</svg>
